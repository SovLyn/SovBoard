name: Release

on:
  push:
    branches:
      - release

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          releaseDraft: true
          releaseName: "sovboard v__VERSION__"
          releaseBody: |
            ## 变更

            - 剪贴板历史管理（文本/HTML/图片/文件）
            - P2P 局域网文件分享（QUIC + mDNS）
            - 全局快捷键 QuickSelector
            - 暗色模式（亮色/暗色/跟随系统）
            - 系统托盘后台运行

            ## 校验

            | 平台 | SHA256 |
            |------|--------|
            | Windows | 见附件 |
            | macOS | 见附件 |
            | Linux | 见附件 |
